name: windows-ci

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run package:windows